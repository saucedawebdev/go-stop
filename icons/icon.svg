<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Gloss overlay gradient -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Curved divider shadow for depth -->
    <linearGradient id="divider-shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Clip for rounded square -->
    <clipPath id="rounded-square">
      <rect x="64" y="64" width="896" height="896" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- Background rounded square with shadow -->
  <g filter="url(#shadow)">
    <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="#1a1a1a"/>
  </g>

  <g clip-path="url(#rounded-square)">
    <!-- Left half: GO (green) -->
    <rect x="64" y="64" width="448" height="896" fill="#34C759"/>

    <!-- Right half: STOP (red) -->
    <rect x="512" y="64" width="448" height="896" fill="#FF3B30"/>

    <!-- Divider shadow strip for depth -->
    <path
      d="M 480 64 Q 512 512 480 960 L 520 960 Q 552 512 520 64 Z"
      fill="url(#divider-shadow)"
    />

    <!-- Curved white divider  card edge flipping -->
    <path
      d="M 488 64
         C 505 256, 505 768, 488 960
         L 508 960
         C 525 768, 525 256, 508 64
         Z"
      fill="#FFFFFF"
      opacity="0.95"
    />

    <!-- Highlight on divider edge -->
    <path
      d="M 490 80
         C 506 270, 506 754, 490 944"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- GO text -->
    <text
      x="288"
      y="560"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, system-ui, sans-serif"
      font-size="180"
      font-weight="700"
      fill="#FFFFFF"
      letter-spacing="8"
    >GO</text>

    <!-- STOP text -->
    <text
      x="736"
      y="560"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, system-ui, sans-serif"
      font-size="120"
      font-weight="700"
      fill="#FFFFFF"
      letter-spacing="4"
    >STOP</text>
  </g>

  <!-- Gloss overlay -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#gloss)" pointer-events="none"/>
</svg>
